<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiêu Tử Bá Đạo — Toàn map 56×56</title>
<style>
  html,body{margin:0;background:#0f1409;color:#f0e4c4;font:14px/1.5 "Segoe UI",Arial,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid #3b4a26;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  h1{margin:0;font-size:18px;letter-spacing:.4px;color:#ffe6a8}
  .sub{opacity:.75;font-size:12.5px}
  a.btn{margin-left:auto;background:#25401a;border:1px solid #6b8a3c;color:#dff0be;padding:7px 14px;border-radius:8px;text-decoration:none;font-size:13px}
  .wrap{padding:12px;display:flex;justify-content:center}
  img{max-width:100%;height:auto;border:1px solid #3b4a26;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .legend{display:flex;gap:18px;flex-wrap:wrap;padding:0 18px 18px;font-size:12.5px;opacity:.9}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<header>
  <h1>Tiêu Tử Bá Đạo — toàn map 56×56</h1>
  <span class="sub">7168×3584 world px · 9 bãi quái × 20 con = 180 · dựng từ dữ liệu game</span>
  <a class="btn" href="index.html">▶ Vào game</a>
</header>
<div class="wrap"><img src="assets/overview/overview-map.jpg" alt="Toàn map"></div>
<div class="legend">
  <span><i class="dot" style="background:#ffdc78"></i>vòng vàng = bãi quái (kèm cấp)</span>
  <span><i class="dot" style="background:#ff463c"></i>chấm đỏ = 1 quái (20 mỗi bãi)</span>
  <span><i class="dot" style="background:#78dcff"></i>chấm xanh = Thôn Vân Sơn</span>
  <span>Nền: 3×3 mảng tranh vẽ tay (4 mảng, đảo chiều)</span>
</div>
</body>
</html>
