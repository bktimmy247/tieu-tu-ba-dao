<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tiêu Tử Bá Đạo</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e13;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;user-select:none;-webkit-user-select:none}
  #game{position:fixed;inset:0}
  .panel{position:fixed;z-index:5;background:linear-gradient(#2c1c0c,#160e06);border:1px solid #a07a34;box-shadow:0 2px 8px #000a;color:#f0d79a}
  /* khung nhân vật */
  #me{left:8px;top:8px;display:flex;gap:8px;padding:6px 10px 6px 6px;border-radius:10px}
  #me .ava{width:54px;height:54px;border-radius:50%;border:2px solid #d4a64a;background:#3a2a18 url(assets/lt/portrait-lang-van.webp) center/cover}
  #me .nm{font-size:13px;font-weight:700;color:#ffe6a8}
  #me .lv{font-size:11px;color:#c9b07a}
  .bar{position:relative;width:150px;height:11px;margin-top:4px;background:#000;border:1px solid #5a4420;border-radius:6px;overflow:hidden}
  .bar i{position:absolute;inset:0;width:100%;border-radius:6px}
  .bar span{position:absolute;inset:0;font-size:9px;line-height:11px;text-align:center;color:#fff;text-shadow:0 0 2px #000}
  #hp i{background:linear-gradient(#ff6a5a,#b0201a)} #mp i{background:linear-gradient(#5ab0ff,#1a4ab0)}
  /* bản đồ nhỏ */
  #mini{right:8px;top:8px;width:170px;padding:4px;border-radius:10px;text-align:center}
  #mini .area{font-size:12px;font-weight:700;color:#ffe6a8;margin:2px 0 4px}
  #mapbox{position:relative;width:170px;height:100px;overflow:hidden;border-radius:6px;background:#06080a}
  #mapbox canvas{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;transform:scaleY(.6) rotate(45deg);image-rendering:pixelated}
  #mini .pos{font-size:10px;color:#c9b07a;margin-top:3px}
  /* thanh kỹ năng */
  #skills{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px;border-radius:12px}
  .sk{position:relative;width:52px;height:52px;border-radius:8px;border:1px solid #d4a64a;background:#1d140a center/cover;cursor:pointer;color:#fff;font-size:10px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
  .sk b{position:absolute;left:3px;top:1px;font-size:10px;color:#ffe6a8;text-shadow:0 0 2px #000}
  .sk em{position:relative;font-style:normal;padding:1px 3px;background:#000a;border-radius:3px;margin-bottom:2px}
  .sk .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:#000b}
  .sk.on{box-shadow:0 0 10px #ffd36a;border-color:#ffd36a}
  /* kinh nghiệm */
  #exp{position:fixed;left:0;right:0;bottom:0;height:5px;background:#000;z-index:6}
  #exp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c9a03a,#ffe08a)}
  #log{position:fixed;left:8px;bottom:14px;z-index:5;width:min(300px,40vw);font-size:11px;color:#e8d9b5;text-shadow:0 0 3px #000;pointer-events:none}
  #log div{margin-top:2px;opacity:.95}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:7;font-size:22px;font-weight:800;color:#ffe08a;text-shadow:0 0 8px #000,0 0 2px #000;opacity:0;transition:opacity .4s;pointer-events:none}
  #start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(#1c140acc,#000e);color:#ffe6a8}
  #start h1{margin:0;font-size:clamp(26px,6vw,44px);letter-spacing:2px;text-shadow:0 0 12px #c98a2a}
  #start p{margin:0;font-size:13px;color:#c9b07a;text-align:center;max-width:360px;line-height:1.5}
  #start button{font-size:18px;padding:10px 28px;border-radius:24px;border:1px solid #ffd36a;background:linear-gradient(#a8741e,#5a3a0c);color:#fff;cursor:pointer}
  @media (max-width:600px){#mini{width:120px}#mapbox{width:120px;height:80px}#mapbox canvas{width:90px;height:90px;margin:-45px 0 0 -45px}.bar{width:110px}.sk{width:46px;height:46px}#log{display:none}}
.sk.lock{filter:grayscale(1) brightness(.55)}

/* ---- điều khiển cảm ứng ---- */
#touch{position:fixed;inset:auto 0 0 0;height:190px;pointer-events:none;z-index:12;display:none}
#touch.on{display:block}
#joy{position:absolute;left:18px;bottom:18px;width:132px;height:132px;border-radius:50%;
 background:rgba(20,16,12,.42);border:2px solid rgba(240,215,160,.45);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
 background:radial-gradient(circle at 38% 34%,#f6e2b4,#b8894a 70%,#6b4a20);opacity:.92}
#atk{position:absolute;right:22px;bottom:26px;width:104px;height:104px;border-radius:50%;pointer-events:auto;
 border:3px solid #e8c87c;background:radial-gradient(circle at 40% 34%,#8f2b28,#4a1414);
 color:#ffe9b0;font:bold 20px "Segoe UI",Arial;letter-spacing:1px;touch-action:none}
#atk:active{transform:scale(.95)}
#cds{position:absolute;right:140px;bottom:34px;display:flex;gap:10px;pointer-events:none}
#cds .c{width:64px;height:64px;border-radius:14px;border:2px solid #b58a3c;background:#20160e;position:relative;overflow:hidden}
#cds .c b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe9b0;font:bold 15px "Segoe UI"}
#cds .c s{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.68);height:0}
#cds .c em{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:11px "Segoe UI";color:#ffd9a0;font-style:normal}
#touch.off{display:none}


</style>
</head>
<body>
<div id="game"></div>
<div id="me" class="panel"><div class="ava"></div><div><div class="nm">Lăng Vân</div><div class="lv" id="lv">Cấp 1</div>
  <div class="bar" id="hp"><i></i><span></span></div><div class="bar" id="mp"><i></i><span></span></div></div></div>
<div id="mini" class="panel"><div class="area" id="area">Thôn Vân Sơn</div><div id="mapbox"><canvas id="mm" width="56" height="56"></canvas><canvas id="mmd" width="56" height="56"></canvas></div><div class="pos" id="pos"></div></div>
<div id="skills" class="panel">
  <div class="sk" id="skAuto" style="background-image:url(assets/lt/icon-basic.webp)" title="Tự đánh (A)"><b>A</b><em>Tự đánh</em></div>
  <div class="sk" id="sk1" title="Tuyệt kỹ (1)" style="background-image:url(assets/lt/icon-ultimate.webp)"><b>1</b><em>Tuyệt kỹ</em><div class="cd"></div></div>
  <div class="sk" id="skPot" title="Hồi máu (2)"><b>2</b><em>Hồi máu</em><div class="cd"></div></div>
</div>
<div id="fps" style="position:fixed;right:10px;top:6px;font:11px Segoe UI,Arial;color:#d9c79a;opacity:.85;z-index:60;pointer-events:none"></div>
<div class="sk" id="mus" title="Bat/tat nhac"><b>M</b><em>Nhac</em></div>
<div id="exp"><i></i></div>
<div id="log"></div>
<div id="toast"></div>
<div id="start"><h1>TIÊU TỬ BÁ ĐẠO</h1><p>Chạm vào đất để đi · chạm vào quái để đánh<br>A: tự đánh · 1: tuyệt kỹ · 2: hồi máu</p><button id="go">Vào game</button></div>
<div id="err" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;background:#5a0f0f;color:#ffd9d9;font:12px/1.35 Consolas,monospace;padding:8px 10px;z-index:9999;white-space:pre-wrap"></div>
<script src="vendor/phaser.min.js"></script>
<script src="js/ground.js"></script>
<script>window.__KT_VER=20;</script>
<script src="js/loot.js?v=22"></script>
<script src="js/story.js?v=22"></script>
<script src="js/game.js?v=22"></script>

<div id="touch" style="display:none">
  <div id="joy"><i></i></div>
  <div id="cds">
    <div class="c" id="c1"><b>1</b><s></s><em>Tuyệt</em></div>
    <div class="c" id="c2"><b>2</b><s></s><em>Hồi</em></div>
  </div>
  <button id="atk">ĐÁNH</button>
</div>

</body>
</html>
