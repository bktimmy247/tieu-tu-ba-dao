<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tiêu Tử Bá Đạo · AFK HD Benchmark</title><style>
:root{--ink:#3a2410;--gold:#d39a38;--cream:#f8e8c3;--red:#d83b2e}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#20160d;color:var(--ink);font-family:Segoe UI,Arial}body{display:flex;align-items:center;justify-content:center}.stage{position:relative;width:100vw;height:100vh;min-height:360px;background:radial-gradient(ellipse at 50% 35%,#fff9e9 0,#f1d29a 45%,#b4773c 100%);overflow:hidden}.stage:before{content:"";position:absolute;inset:10% 8%;border:12px solid #a96d34;border-radius:28px;box-shadow:inset 0 0 0 5px #e2b660,inset 0 0 80px #8a4b2d55;transform:perspective(600px) rotateX(12deg);background:repeating-linear-gradient(0deg,#a65b36 0 16px,#bd7646 16px 19px)}.title{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;padding:6px 18px;border:2px solid #b98935;border-radius:18px;background:#fff1c9dd;font-weight:800;letter-spacing:.5px;white-space:nowrap}.badge{position:absolute;z-index:5;top:64px;left:50%;transform:translateX(-50%);font-size:12px;color:#714a20}.fighters{position:absolute;inset:15% 10% 16%;z-index:3;display:flex;align-items:center;justify-content:space-around}.fighter{text-align:center;position:relative;min-width:24%;}.unit{margin:auto;width:188px;height:200px;background-repeat:no-repeat;background-position:0 0;background-size:600% 300%;filter:drop-shadow(0 14px 8px #4e2b1855);animation:bob 2.2s ease-in-out infinite}.enemy .unit{transform:scaleX(-1);animation-delay:.3s}.name{font-weight:800;text-shadow:0 1px #fff;font-size:15px;margin-top:2px}.bar{height:11px;max-width:190px;margin:7px auto;background:#4b281b;border:1px solid #fff8;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3dbe63,#b9e86c);width:100%}.enemy .bar i{background:linear-gradient(90deg,#ee4939,#ffab49)}.versus{font-size:42px;font-weight:900;color:#c1781d;text-shadow:0 2px #fff;animation:pulse 1.2s infinite}.damage{position:absolute;left:50%;top:42%;transform:translateX(-50%);font-weight:900;font-size:clamp(28px,6vw,64px);color:#e03b2b;text-shadow:0 3px #fff,0 0 16px #ffad3d;animation:float .75s forwards;z-index:8}.vfx{position:absolute;left:50%;top:52%;width:220px;height:226px;transform:translate(-50%,-50%);background:url('assets/lt/vfx-skill.webp') 0 0/600% 400% no-repeat;mix-blend-mode:screen;pointer-events:none;z-index:7;display:none}.controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px;align-items:center}.controls button{border:0;border-radius:12px;padding:11px 18px;background:#d49a38;color:#2c1909;font-weight:800;box-shadow:0 4px #84521e;font-size:14px}.meta{position:absolute;bottom:10px;right:14px;z-index:5;font-size:10px;color:#5a3619;background:#fff0c8aa;padding:4px 7px;border-radius:6px}@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -9px}}@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}@keyframes float{to{opacity:0;translate:0 -80px}}@media(max-width:700px) and (orientation:portrait){.stage:after{content:'Xoay ngang máy để xem benchmark';position:absolute;inset:0;display:grid;place-items:center;background:#1d130b;color:#ffe4a2;font-weight:800;font-size:18px;text-align:center;z-index:30}.unit{width:150px;height:160px}.fighters{inset:18% 3% 20%}.versus{font-size:25px}.controls button{padding:8px 11px;font-size:12px}}
</style></head><body><main class="stage"><div class="title">Tiêu Tử Bá Đạo · AFK HD Benchmark</div><div class="badge">Hero + quái dùng atlas HD Lục Thần · không upscale atlas thấp</div><section class="fighters"><div class="fighter hero"><div class="unit"></div><div class="name">Lăng Vân · Người Giữ Ấn</div><div class="bar"><i></i></div></div><div class="versus">VS</div><div class="fighter enemy"><div class="unit"></div><div class="name">Tịnh Mặc · Tàn Ảnh</div><div class="bar"><i></i></div></div></section><div class="vfx"></div><div class="controls"><button id="atk">ĐÁNH THƯỜNG</button><button id="ult">TUYỆT KỸ</button><button id="reset">ĐẶT LẠI</button></div><div class="meta">HD cells · 188×200 · VFX hit/skill · landscape-first</div></main><script>
const hero={file:'assets/lt-hd/lang-van-',idle:'idle',basic:'basic',ultimate:'ultimate',w:188,h:200,cols:6,frames:15};const enemy={file:'assets/lt-hd/tinh-mac-',idle:'idle',basic:'basic',w:228,h:208,cols:6,frames:15};const H=document.querySelector('.hero .unit'),E=document.querySelector('.enemy .unit'),V=document.querySelector('.vfx');let timer=0,frame=0,enemyHp=100,heroHp=100;
function sheet(el,o,clip){el.style.backgroundImage=`url('${o.file}${clip}.webp')`;el.style.backgroundSize=`${o.cols*100}% ${Math.ceil(o.frames/o.cols)*100}%`;}
function f(el,o,clip,i){sheet(el,o,clip);el.style.backgroundPosition=`${(i%(o.cols-1))*100/(o.cols-1)}% ${Math.floor(i/o.cols)*100/(Math.ceil(o.frames/o.cols)-1)}%`;}
function idle(){clearInterval(timer);timer=setInterval(()=>{frame=(frame+1)%15;f(H,hero,'idle',frame);f(E,enemy,'idle',frame)},120)}
function hit(d){enemyHp=Math.max(0,enemyHp-d);document.querySelector('.enemy .bar i').style.width=enemyHp+'%';const x=document.createElement('div');x.className='damage';x.textContent='-'+d;document.body.appendChild(x);setTimeout(()=>x.remove(),800);V.style.display='block';V.style.backgroundPosition='0 0';setTimeout(()=>V.style.display='none',650);f(H,hero,'basic',0);setTimeout(()=>f(H,hero,'idle',0),650);if(enemyHp===0){document.querySelector('.badge').textContent='Đạt mốc chất lượng: battle thắng';}}
function ult(){V.style.display='block';V.style.backgroundSize='600% 400%';let i=0;const t=setInterval(()=>{V.style.backgroundPosition=`${(i%6)*20}% ${Math.floor(i/6)*33.33}%`;i++;if(i>=19){clearInterval(t);V.style.display='none'}},55);f(H,hero,'ultimate',0);setTimeout(()=>f(H,hero,'idle',0),850);hit(34)}
document.getElementById('atk').onclick=()=>hit(12);document.getElementById('ult').onclick=ult;document.getElementById('reset').onclick=()=>{enemyHp=100;document.querySelector('.enemy .bar i').style.width='100%';document.querySelector('.badge').textContent='Hero + quái dùng atlas HD Lục Thần · không upscale atlas thấp'};sheet(H,hero,'idle');sheet(E,enemy,'idle');idle();
</script></body></html>
